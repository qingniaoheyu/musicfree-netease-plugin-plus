name: Build Patched APK

# 手动触发即可构建修复版 APK
# 修复内容：让插件设置的 Cookie 头不再被 RN 原生 Cookie 存储覆盖
# 对应上游 issue: #670 / #655

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK 类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [master]
    paths:
      - 'src/core/pluginManager/plugin.ts'
      - '.github/workflows/build-patched-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --parallel --no-daemon

      - name: Build Release APK (debug-signed)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease --parallel --no-daemon

      - name: List APKs
        run: find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musicfree-patched-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
